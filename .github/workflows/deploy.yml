name: Companion Connect Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Code Linting, Type Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Validate Prisma Schema
      run: npx prisma validate

    - name: Run Next.js Build
      run: npm run build

  build-and-push-docker:
    name: Build & Push Docker Image to Amazon ECR
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Tag Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/companion-connect:$IMAGE_TAG -t $ECR_REGISTRY/companion-connect:latest .
        docker push $ECR_REGISTRY/companion-connect:$IMAGE_TAG
        docker push $ECR_REGISTRY/companion-connect:latest

  deploy-to-kubernetes:
    name: Deploy to Amazon EKS Cluster
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy Kubernetes Manifests
      run: |
        echo "Applying Kubernetes manifests to EKS cluster..."
